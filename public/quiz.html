<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A free 12-question investment banking technicals quiz: find your interview readiness level and what to fix first.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Superday Readiness Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one centered column; a hero, then one question per screen, then a result sheet. Same visual system as the Superday Prep app. */
:root{
  --bg:#ECEFEC; --surface:#F8FAF8; --sunk:#E2E7E3; --ink:#13201B; --muted:#56665F; --line:#CBD4CF;
  --accent:#1D6A4C; --accent-ink:#FFFFFF; --accent-soft:#D5E7DE;
  --red:#AE3636; --red-soft:#F3DEDC; --amber:#9A620E; --blue:#2E5B88;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201C; --sunk:#111916; --ink:#E2EAE5; --muted:#93A39B; --line:#2B3833;
  --accent:#4FB388; --accent-ink:#08120D; --accent-soft:#1D3229;
  --red:#E27474; --red-soft:#3A1F1F; --amber:#D9A24A; --blue:#82AAD6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201C; --sunk:#111916; --ink:#E2EAE5; --muted:#93A39B; --line:#2B3833;
  --accent:#4FB388; --accent-ink:#08120D; --accent-soft:#1D3229;
  --red:#E27474; --red-soft:#3A1F1F; --amber:#D9A24A; --blue:#82AAD6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px}
.brand b{font:700 1.15rem var(--display);letter-spacing:.01em}
.eyebrow{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(2.2rem,7vw,3.4rem)/1.02 var(--display);letter-spacing:-.015em;margin:8px 0 14px;text-wrap:balance}
h2{font:600 1.5rem/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 1.05rem/1.25 var(--display);margin:0}
p{margin:0}
.lede{font-size:1.1rem;color:var(--muted);max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:20px 0 26px;font:500 .85rem var(--mono);color:var(--muted)}
.facts span::before{content:"▪ ";color:var(--accent)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:30px}
.topics div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.88rem}
.topics b{display:block;font-family:var(--display);font-size:1rem}
.btn{font:600 1rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{color:var(--muted);font-size:.85rem}
.prog{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font:500 1.35rem/1.38 var(--body);margin:6px 0 20px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1.8em minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:1rem}
.opt kbd{font:600 .78rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;text-align:center;padding:1px 0}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.unsure{color:var(--muted);font-style:italic}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.explain{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:4px}
.explain.miss{border-left-color:var(--red)}
.explain b{display:block;margin-bottom:4px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.big b{font:600 3.4rem/1 var(--mono)}
.big small{font-size:1.2rem;color:var(--muted)}
.level{font:700 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1.5px solid currentColor}
.l0{color:var(--red)}.l1{color:var(--amber)}.l2{color:var(--accent)}.l3{color:var(--blue)}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:18px 0 6px}
.ladder div{padding:6px 8px;border-top:4px solid var(--line);font-size:.75rem;color:var(--muted)}
.ladder div.on{border-top-color:var(--accent);color:var(--ink);font-weight:600}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.trow{display:grid;grid-template-columns:9.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:18px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.pips i.ok{background:var(--accent);border-color:var(--accent)}
.pips i.no{background:var(--red-soft);border-color:var(--red)}
.tag{font:600 .7rem var(--mono);letter-spacing:.05em;text-transform:uppercase}
.tag.s{color:var(--accent)}.tag.m{color:var(--amber)}.tag.g{color:var(--red)}
.section{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fix li{padding:12px 14px;background:var(--bg);border-radius:6px;font-size:.95rem}
.fix li b{display:block;font-family:var(--display);font-size:1rem}
.cta{margin-top:28px;padding:22px;border-radius:8px;background:var(--ink);color:var(--bg)}
.cta h2{color:var(--bg)}
.cta p{color:var(--bg);opacity:.85;margin:6px 0 16px;max-width:56ch}
.cta .btn.primary{background:var(--accent);border-color:var(--accent)}
details.miss{border-top:1px solid var(--line);padding:10px 0}
details.miss summary{cursor:pointer;font-size:.95rem}
details.miss summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.miss .body{padding:8px 0 0;font-size:.92rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
details.miss .body b{color:var(--ink)}
textarea{width:100%;font:14px/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;min-height:110px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:.9rem}
@media (max-width:560px){.trow{grid-template-columns:7.5em minmax(0,1fr)}.trow .tag{grid-column:2}.ladder div{font-size:.68rem;padding:6px 4px}.q{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Superday Prep</b><span class="eyebrow">Free readiness quiz</span></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/quiz.js"></script>
</body>
</html>
